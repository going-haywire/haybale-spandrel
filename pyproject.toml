[project]
name = "haybale-spandrel-dev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [ "haywire-studio>=0.3.0", "haybale-studio>=0.3.0", "haybale-marketplace>=0.3.0", "haybale-spandrel", "haybale-core", "haybale-image", "haybale-models", "haybale-graph-editor",]

[tool.uv.workspace]
members = [ "barn/*",]

[tool.uv.sources.haywire-studio]
path = "../haywire-repo/packages/haywire-studio"
editable = true

[tool.uv.sources.haywire-core]
path = "../haywire-repo/packages/haywire-core"
editable = true

[tool.uv.sources.haybale-core]
path = "../haywire-repo/barn/haybale-core"
editable = true

[tool.uv.sources.haybale-studio]
path = "../haywire-repo/barn/haybale-studio"
editable = true

[tool.uv.sources.haybale-marketplace]
path = "../haywire-repo/barn/haybale-marketplace"
editable = true

[tool.uv.sources.haybale-spandrel]
workspace = true


[tool.uv.sources.haybale-image]
path = "../haywire-repo/barn/haybale-image"
editable = true

[tool.uv.sources.haybale-models]
path = "../haywire-repo/barn/haybale-models"
editable = true

[tool.uv.sources.haybale-graph-editor]
path = "../haywire-repo/barn/haybale-graph-editor"
editable = true

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout", "ruff==0.12.12", "mypy==2.1.0"]

[tool.ruff]
line-length = 109

[tool.ruff.lint]
extend-select = ["E501", "PT", "B", "TID252", "TID251"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"haywire.core".msg = "Import from haywire.api (Author API)."
"haywire.ui".msg = "Import from haywire.api.workbench (Author API)."
"haywire.barn".msg = "Import from haywire.api (Author API)."

[tool.ruff.lint.per-file-ignores]
# Test harness needs framework internals the Author API does not export; reported to the maintainer.
"tests/**" = ["TID251"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["barn/haybale-spandrel"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: graph runs with the full library system",
    "slow: needs the LaMa fixture (about 200 MB)",
]
addopts = "--strict-markers --tb=short"
timeout = 120

[tool.haywire.marketstall]
# This project publishes released wheels to PyPI, so every marketstall row
# carries `haybale-spandrel==<version>` rather than a git clone spec.
# One coordinate per version: a PyPI row and a git row of the same name read
# as two different libraries to a subscriber.
distribute = "pypi"
